<div mat-dialog-content fxLayout="row" fxLayoutGap="1em">
    <mat-form-field appearance="outline">
      <mat-label>Company Name</mat-label>
      <input oninput="this.value = this.value.toUpperCase()" matInput [(ngModel)]="name">
    </mat-form-field>
    <button mat-icon-button (click)="addCompany()"><mat-icon>check</mat-icon></button>
</div>
