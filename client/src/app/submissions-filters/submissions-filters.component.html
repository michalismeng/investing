<mat-accordion>
  <mat-expansion-panel expanded='true'>

  <mat-expansion-panel-header>
    <mat-panel-title>
      <div class='mat-body-strong'>Filters</div>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <form [formGroup]='filtersForm' formstore="submissions">
    <mat-form-field style='width: 100%'>
      <mat-label>Name</mat-label>
      <input type="text" matInput formControlName='nameSelection'>
    </mat-form-field>

    <mat-form-field style='width: 100%'>
      <mat-label>Form <div class="mat-small" style="display: inline;">(Comma-separated list)</div></mat-label>
      <input type="text" matInput formControlName='formSelection'>
    </mat-form-field>
  </form>

  </mat-expansion-panel>
</mat-accordion>
